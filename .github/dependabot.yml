version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    ignore:
      # typescript-eslint pins a TypeScript peer range; lift once it supports the next major
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      npm-version-updates:
        applies-to: 'version-updates'
        patterns:
          - '*'
      npm-security-updates:
        applies-to: 'security-updates'
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns:
          - '*'
